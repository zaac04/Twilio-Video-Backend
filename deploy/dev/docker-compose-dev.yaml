services:
  video-service:
    image: 851874770356.dkr.ecr.us-east-1.amazonaws.com/stargazer-video-service:latest
    restart: always
    env_file: .env
    ports:
      - ${APP_PORT}:${APP_PORT}
    volumes:
      - ./credentials:/app/credentials:ro
    depends_on:
      video-service-db:
        condition: service_healthy


      
  video-service-db:
    image: postgres:latest
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-db:/var/lib/postgresql/
    ports:
      - ${DB_PORT_EXTERNAL}:5432
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-db:

networks:
  default:
      name: stargazer_network
      external: true