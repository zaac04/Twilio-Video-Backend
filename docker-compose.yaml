services:

  video_service:
    build: 
      context: .
      dockerfile: ./deploy/Dockerfile
    env_file: config.env
    ports:
      - 4001:4000

  pg:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=8242
      - POSTGRES_DB=whitelake
    volumes:
      - postgres-db:/var/lib/postgresql/
    ports:
      - "5432:5432"

volumes:
  postgres-db:

networks:
  default:
      name: stargazer_network
      external: true